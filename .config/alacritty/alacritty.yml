#字体设置
#12345678901234567890
#abcdefghijABCDEFGHIJ
#一二三四五六七八九十
#汉字能不能对齐
font:
        #  normal:
        #    family: Inconsolata
        #    style: Regular
  normal:
    #family: Noto Sans Mono
    family: Test Mono
    style: Regular

  bold:
    family: Test Mono
    style: Bold

  italic:
    family: Test Mono
    style: Italic

  size: 10

#颜色设置 
#
# Colors (Nord)
colors:
  # Default colors
  primary:
    background: '0x2E3440'
    foreground: '0xD8DEE9'

  # Normal colors
  normal:
    black:   '0x3B4252'
    red:     '0xBF616A'
    green:   '0xA3BE8C'
    yellow:  '0xEBCB8B'
    blue:    '0x81A1C1'
    magenta: '0xB48EAD'
    cyan:    '0x88C0D0'
    white:   '0xE5E9F0'

  # Bright colors
  bright:
    black:   '0x4C566A'
    red:     '0xBF616A'
    green:   '0xA3BE8C'
    yellow:  '0xEBCB8B'
    blue:    '0x81A1C1'
    magenta: '0xB48EAD'
    cyan:    '0x8FBCBB'
    white:   '0xECEFF4'
#背景透明度
window:
    opacity: 0.8
