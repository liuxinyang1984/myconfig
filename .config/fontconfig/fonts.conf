<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<!-- f-->
<fontconfig>
    <!-- 第一步，设置默认的渲染参数 -->
    <match target="font">
        <!-- 修整像素大小(小于10px的调整到10px，否则四舍五入到整数) -->
        <edit name="pixelsize">
            <if>
                <less>
                    <name>pixelsize</name>
                    <double>10</double>
                </less>
                <int>10</int>
                <round>
                    <name>pixelsize</name>
                </round>
            </if>
        </edit>
        <!-- 开启抗锯齿(smooth) -->
        <edit name="antialias">
            <bool>true</bool>
        </edit>
        <!-- 优先使用内嵌微调，同时默认开足微调 -->
        <edit name="hinting">
            <bool>true</bool>
        </edit>
        <edit name="autohint">
            <bool>false</bool>
        </edit>
        <!-- 依个人喜好,你也可能喜欢默认"hintslight"(此时可将下面的"第七步"全部注释掉) -->
        <edit name="hintstyle">
            <const>hintfull</const>
            <!-- <const>hintlight</const> -->
        </edit>
        <!-- LCD特征设置 -->
        <edit name="rgba">
            <const>rgb</const>
        </edit>
        <edit name="lcdfilter">
            <const>lcddefault</const>
        </edit>
        <!-- 禁用内嵌点阵 -->
        <edit name="embeddedbitmap">
            <bool>false</bool>
        </edit>
        <!-- 禁用合成粗体 -->
        <edit name="embolden">
            <bool>false</bool>
        </edit>
    </match>
    
    <!-- 单独设置 JetBrains 中文字体 -->
    <match target="font">
        <test name="family">
            <string>JetBrainsMono Nerd Font</string>
        </test>
        <edit binding="same" name="family" mode="assign">
            <string>JetBrainsMono Nerd Font</string>
        </edit>
        <edit binding="same" name="family" mode="assign">
            <string>Noto Sans Mono CJK SC</string>
        </edit>
    </match>

    <!-- 设置字体别名 -->
    <alias>
        <family>serif</family>
        <prefer>
            <family>Noto Sans CJK SC</family> <!-- 首选简体中文字体 -->
        </prefer>
    </alias>

    <alias>
        <family>sans-serif</family>
        <prefer>
            <family>Noto Serif CJK SC</family> <!-- 首选简体中文字体 -->
        </prefer>
    </alias>

    <alias>
        <family>monospace</family>
        <prefer>
            <family>JetBrainsMono Nerd Font</family>
            <family>Noto Sans Mono CJK SC</family> <!-- 首选简体中文字体 -->
        </prefer>
    </alias>

    <alias>
        <family>My Mono</family>
        <prefer>
            <family>JetBrainsMono Nerd Font</family>
            <family>Noto Sans Mono CJK SC</family> <!-- 首选简体中文字体 -->
        </prefer>
    </alias>

    <alias>
        <family>JetBrainsMono Nerd Font</family>
        <prefer>
            <family>JetBrainsMono Nerd Font</family>
            <family>Noto Sans Mono CJK SC</family> <!-- 首选简体中文字体 -->
        </prefer>
    </alias>

</fontconfig>

