# 固定 TopTerm 在 DVI-D-1 的顶部 240px 区域
windowrulev2 = monitor DVI-D-1, title:^(MyPopTerm)$
windowrulev2 = size 1180 310, title:^(MyPopTerm)$
windowrulev2 = move 10 10, title:^(MyPopTerm)$
windowrulev2 = float, title:^(MyPopTerm)$
windowrulev2 = pin, title:^(MyPopTerm)$
windowrulev2 = rounding 0, title:^(MyPopTerm)$
windowrulev2 = bordercolor rgb(0099ff) rgb(333333), title:^(MyPopTerm)$
windowrulev2 = bordersize 5, title:^(MyPopTerm)$
# =======================
# Window Rules (v2 syntax)
# =======================

# Authentication dialogs
windowrulev2 = float, class:^(org.kde.polkit-kde-authentication-agent-1)$

# Network and audio tools
windowrulev2 = float, class:^(nm-connection-editor|blueman-manager)$
windowrulev2 = float, class:^(vlc|pavucontrol)$
windowrulev2 = float, class:^(nwg-look|qt5ct|mpv)$

# Zoom – make sure class is correct (e.g. Zoom or zoom)
windowrulev2 = float, class:^(Zoom|zoom)$

# Rofi
windowrulev2 = float, class:^(rofi)$

# Swappy – pin and center
windowrulev2 = pin, class:^(swappy)$
windowrulev2 = center, class:^(swappy)$

# Specific borders
windowrulev2 = bordersize, class:^(google-chrome)$
windowrulev2 = bordersize, class:^(microsoft-edge)$

# Workspaces
windowrulev2 = workspace 2, class:^(code-)(.*)$
windowrulev2 = workspace 3, class:^(obsidian)$
windowrulev2 = workspace 4, class:^(com.obsproject.Studio)$
windowrulev2 = workspace 5 silent, class:^(Steam)$, title:^(Steam)$

# File operation progress dialog
windowrulev2 = float, title:^(File Operation Progress)$

# Camera (workspace 8)
windowrulev2 = float, workspace 8, class:^(camera)$

# Vite (workspace 8)
windowrulev2 = float, workspace 8, class:^(vite)$
windowrulev2 = move 100%-350px 80px, class:^(vite)$

# Opacity for pinned windows
windowrulev2 = opacity 1 override 1 override, pinned:1

# Optional: enable these for specific states
# windowrulev2 = opacity 0.9 0.7, class:^(firefox)$
# windowrulev2 = bordercolor rgb(EE4B55) rgb(880808), fullscreen:1
# windowrulev2 = bordercolor rgb(282737) rgb(1E1D2D), floating:1
# windowrulev2 = opacity 0.8 0.8, pinned:1


# Edge文件操作窗口
windowrulev2 = float, class:^(microsoft-edge)$, title:^(Open file)$

